<div
    class="flex flex-col w-full bg-white border border-t-4 shadow-sm border-t-elephant-900 rounded-xl">
    <div class="p-4 md:p-5">
        <form [formGroup]="form">
            <app-form-input-field [formGroup]="form" label="Name" fieldName="name" />
            <app-form-input-field [formGroup]="form" label="Description" fieldName="description" />
            <app-form-input-field
                [formGroup]="form"
                label="Organization"
                fieldName="organization" />
        </form>
    </div>
    <div class="flex p-4 space-x-2">
        <app-button
            [isLoading]="isLoading"
            (clicked)="onSubmit()"
            [label]="'Save Changes'"
            [isCancel]="false"
            [isLarge]="false"
            [isDisabled]="form.invalid!"
            [type]="'save'" />
    </div>
</div>
